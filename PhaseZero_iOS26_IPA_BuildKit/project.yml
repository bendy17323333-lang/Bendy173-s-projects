name: PhaseZero
options:
  minimumXcodeGenVersion: 2.42.0
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    LD_RUNPATH_SEARCH_PATHS:
      - "$(inherited)"
      - "@executable_path/Frameworks"
targets:
  PhaseZero:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/AppModule
        excludes:
          - Resources
      - path: Sources/AppModule/Resources/Assets.xcassets
        buildPhase: resources
      - path: Sources/AppModule/Resources/Web
        buildPhase: resources
      - path: Sources/AppModule/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: PhaseZero
        PRODUCT_BUNDLE_IDENTIFIER: com.asher.phasezero.ios26phoneready520
        PRODUCT_MODULE_NAME: PhaseZero
        INFOPLIST_FILE: BuildSupport/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 5.2.0
        CURRENT_PROJECT_VERSION: 9
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          DEBUG_INFORMATION_FORMAT: dwarf
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
          VALIDATE_PRODUCT: YES
    scheme:
      gatherCoverageData: false
      testTargets: []
      archive:
        config: Release
